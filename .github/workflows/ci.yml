name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      # pyproject.toml excludes the slow eval marker by default.
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  api-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Transitional coverage while the API's PostgreSQL tests are integrated.
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tsuyu
          POSTGRES_PASSWORD: tsuyu-ci-only
          POSTGRES_DB: tsuyulabo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tsuyu -d tsuyulabo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://tsuyu:tsuyu-ci-only@localhost:5432/tsuyulabo_test
      JWT_SECRET: tsuyulabo-ci-only-signing-key-never-use-in-production
      BRAIN_MODE: inline
      TSUYU_DEV_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run alembic -c services/api/alembic.ini upgrade head
      - run: uv run pytest services/api
