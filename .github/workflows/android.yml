name: Android alpha

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-alpha*'

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); setup-android@v3 fails trying to install 'tools'.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
      - name: Install dependencies
        run: npm ci
      - name: Sync Android assets
        working-directory: apps/mobile
        env:
          TSUYU_APP_URL: ${{ vars.TSUYU_APP_URL || 'https://tsuyulabo.vercel.app' }}
        run: npx cap sync android
      - name: Build debug APK
        working-directory: apps/mobile/android
        env:
          TSUYU_VERSION_CODE: ${{ github.run_number }}
          TSUYU_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0-alpha.1' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsuyulabo-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish alpha prerelease
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha(\.[0-9]+)?$ ]] || { echo "Invalid alpha tag: $TAG" >&2; exit 1; }
          NOTES="docs/releases/$TAG.md"
          test -f "$NOTES" || { echo "Missing release notes: $NOTES" >&2; exit 1; }
          APK="tsuyulabo-$TAG-debug.apk"
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --title "ツユラボ $TAG" --notes-file "$NOTES"
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --verify-tag --prerelease --title "ツユラボ $TAG" --notes-file "$NOTES"
          fi
