[project]
name = "tsuyu-worker"
version = "0.1.0"
description = "Background worker (arq) for brain and Shiori jobs"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26",
    "redis>=5.2",
    "tsuyulabo-api",
    "tsuyu-brain",
    "tsuyu-shiori",
]

[tool.uv.sources]
tsuyulabo-api = { workspace = true }
tsuyu-brain = { workspace = true }
tsuyu-shiori = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
