[project]
name = "tsuyu-brain"
version = "0.1.0"
description = "Spiking brain engine for Tsuyu Labo (PyTorch)"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5",
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
ingest = ["pyarrow>=18", "pandas>=2.2"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
