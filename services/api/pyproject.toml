[project]
name = "tsuyulabo-api"
version = "0.1.0"
description = "Tsuyu Labo game API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "pgvector>=0.3",
    "pyjwt>=2.10",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.28",
    "tsuyu-brain",
    "tsuyu-shiori",
    "pywebpush>=2.0.3,<3",
    "cryptography>=44",
]

[tool.uv.sources]
tsuyu-brain = { workspace = true }
tsuyu-shiori = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
