[project]
name = "tsuyu-shiori"
version = "0.1.0"
description = "Shiori, the research assistant agent of Tsuyu Labo"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "tsuyu-brain",
]

[tool.uv.sources]
tsuyu-brain = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
