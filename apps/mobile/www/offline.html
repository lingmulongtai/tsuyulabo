<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e4f4ef" />
    <title>ツユラボ α — オフライン</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #294741; background: #e4f4ef; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 32px 24px; }
      main { max-width: 420px; width: 100%; text-align: center; background: #fffdf6; border: 2px solid #bfe3d9; border-radius: 28px; padding: 32px 24px; box-shadow: 0 12px 36px #29474118; }
      svg { width: min(220px, 70%); height: auto; }
      h1 { font-size: 1.45rem; margin: 12px 0; }
      p { line-height: 1.7; margin: 0 0 24px; }
      button { appearance: none; border: 0; border-radius: 999px; background: #327966; color: white; font: inherit; font-weight: 700; padding: 12px 28px; cursor: pointer; }
      button:focus-visible { outline: 3px solid #e3bd68; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 240 240" role="img" aria-label="卵">
        <defs>
          <radialGradient id="egg" cx=".35" cy=".3" r=".8"><stop stop-color="#fff"/><stop offset=".6" stop-color="#f5efe3"/><stop offset="1" stop-color="#d8ccb6"/></radialGradient>
          <radialGradient id="food" cx=".5" cy=".3" r=".8"><stop stop-color="#fbe08a"/><stop offset="1" stop-color="#d9a93a"/></radialGradient>
        </defs>
        <ellipse cx="120" cy="206" rx="80" ry="18" fill="url(#food)" stroke="#c9962a" stroke-width="2"/>
        <path d="M110 84 Q102 58 88 44 M126 82 Q130 56 144 42" stroke="#cfc3ac" stroke-width="7" stroke-linecap="round" fill="none"/>
        <path d="M110 84 Q102 58 88 44 M126 82 Q130 56 144 42" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>
        <ellipse cx="120" cy="138" rx="36" ry="58" transform="rotate(-8 120 138)" fill="url(#egg)" stroke="#b9ac94" stroke-width="2.5"/>
        <ellipse cx="104" cy="118" rx="9" ry="22" transform="rotate(-8 104 118)" fill="#fff" opacity=".9"/>
      </svg>
      <h1>いまはオフラインです</h1>
      <p>ネットワークに接続して、もう一度おためしください。</p>
      <button type="button" onclick="location.href='https://tsuyulabo.vercel.app'">もう一度ためす</button>
    </main>
  </body>
</html>
