<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141310">
<title>オフライン | ツユラボ</title>
<style>
  :root { color-scheme:dark; --bg:#141310; --card:#26231e; --ink:#f2eadc; --muted:#c1b7a6; --line:#776b57; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(ellipse at top right,#59452a,transparent 60%),var(--bg); color:var(--ink); font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif; line-height:1.8; }
  main { max-width:440px; min-height:100dvh; margin:auto; padding:max(32px,env(safe-area-inset-top)) 20px; }
  header { font-size:.85rem; letter-spacing:.12em; margin-bottom:40px; }
  article { border:1px solid var(--line); border-radius:12px; background:var(--card); padding:28px 24px; }
  h1 { font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:1.4rem; font-weight:500; } p { font-size:.95rem; color:var(--muted); }
  svg { width:48px; height:48px; color:#e7bd78; }
  a { display:flex; min-height:44px; align-items:center; justify-content:center; margin-top:24px; border:1px solid var(--line); border-radius:8px; padding:12px; color:var(--ink); text-decoration:none; }
  a:focus-visible { outline:2px solid #e7bd78; outline-offset:4px; }
  @media(prefers-color-scheme:light) { :root { --card:#f7f1e5; --ink:#29251e; --muted:#655b4b; } svg { color:#78551e; } }
</style>
</head>
<body><main>
  <header>ツユラボ</header>
  <article>
    <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 7h20v5H14zM16 12v25a8 8 0 0 0 16 0V12M16 32h16"/></svg>
    <h1>つながるまで、ひとやすみ</h1>
    <p>いまは飼育棚につながりません。通信が戻ったら、この子の様子を見にきてください。</p>
    <p>ごはんやお世話の記録には、インターネット接続が必要です。</p>
    <a href="https://tsuyulabo.vercel.app">もう一度、飼育棚を開く</a>
  </article>
</main></body>
</html>
